<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Admin - Klinik Sehat</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .dashboard-container { max-width: 900px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #f4f7f6; padding-bottom: 10px; }
        .counter { font-size: 64px; font-weight: bold; color: #3498db; text-align: center; margin: 20px 0; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-next { background-color: #3498db; color: white; }
        .btn-next:hover { background-color: #2980b9; }
        .btn-reset { background-color: #e74c3c; color: white; }
        .btn-reset:hover { background-color: #c0392b; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .status-waiting { background-color: #ffeaa7; color: #d63031; }
        .status-done { background-color: #badc58; color: #6ab04c; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h2>Dasbor Antrean Klinik (Bagian Admin)</h2>
       <a href="index.html" style="background: #34495e; color: white; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 14px;">&larr; Form Pasien</a>
    </div>

    <div class="grid">
        <!-- Kolom Kiri: Kontrol Antrean Utama -->
        <div class="card">
            <h3>Antrean Sekarang</h3>
            <div class="counter" id="current-number">A-001</div>
            <button class="btn btn-next" onclick="panggilAntrean()">Panggil Antrean Berikutnya</button>
            <button class="btn btn-reset" onclick="resetAntrean()">Kosongkan Antrean</button>
        </div>

        <!-- Kolom Kanan: Daftar Pasien Hari Ini -->
        <div class="card">
            <h3>Daftar Pasien Menunggu (Hari Ini)</h3>
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Pasien</th>
                        <th>Dokter</th>
                        <th>Jam</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="patient-table-body">

                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let daftarAntrean = [];

    // Fungsi Utama: Mengambil data antrean dari server backend dan menggambar tabel
    function muatDataPasien() {
        fetch('http://localhost:3000/api/antrean')
        .then(response => {
            if (!response.ok) {
                throw new Error('Gagal mengambil data dari server');
            }
            return response.json();
        })
        .then(data => {
            daftarAntrean = data;
            const tableBody = document.getElementById('patient-table-body');
            
            // 1. Jika data dari server kosong
            if (!daftarAntrean || daftarAntrean.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#95a5a6;">Tidak ada antrean tersisa hari ini</td></tr>`;
                document.getElementById('current-number').innerText = "A-000";
                return;
            }

            // 2. Jika ada data, gambar baris tabel secara dinamis
            tableBody.innerHTML = "";
            daftarAntrean.forEach((pasien) => {
                let badgeClass = 'status-waiting';
                if (pasien.status === 'Dipanggil' || pasien.status === 'Selesai') {
                    badgeClass = 'status-done';
                }
                
                tableBody.innerHTML += `
                    <tr>
                        <td><strong>${pasien.nomor}</strong></td>
                        <td>${pasien.nama}</td>
                        <td>${pasien.dokter}</td>
                        <td>${pasien.jam}</td>
                        <td><span class="status-badge ${badgeClass}">${pasien.status}</span></td>
                    </tr>
                `;
            });

            // 3. Tampilkan nomor pasien yang statusnya 'Dipanggil' di layar besar kepala dasbor
            const pasienAktif = daftarAntrean.find(p => p.status === 'Dipanggil');
            if (pasienAktif) {
                document.getElementById('current-number').innerText = pasienAktif.nomor;
            } else {
                const semuaSelesai = daftarAntrean.every(p => p.status === 'Selesai');
                if (semuaSelesai && daftarAntrean.length > 0) {
                    document.getElementById('current-number').innerText = daftarAntrean[daftarAntrean.length - 1].nomor;
                } else {
                    document.getElementById('current-number').innerText = "A-000";
                }
            }
        })
        .catch(error => {
            console.error('Error saat memuat data:', error);
        });
    }

    // Fungsi Pembantu: Mengirimkan perintah pembaruan status ke server backend
    function ubahStatusDiServer(nomorPasien, statusBaru) {
        return fetch(`http://localhost:3000/api/antrean/${nomorPasien}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ status: statusBaru })
        });
    }

    // Fungsi Utama Tombol Panggil: Mengubah alur antrean secara sekuensial
    function panggilAntrean() {
        if (daftarAntrean.length === 0) return alert("Belum ada pasien yang mendaftar!");

        const pasienDipanggil = daftarAntrean.find(p => p.status === 'Dipanggil');
        const pasienMenunggu = daftarAntrean.find(p => p.status === 'Menunggu');

        if (!pasienMenunggu && !pasienDipanggil) {
            return alert("Semua pasien dalam daftar hari ini sudah selesai dipanggil!");
        }

        if (pasienDipanggil) {
            // Selesaikan pasien lama, lalu panggil pasien berikutnya jika ada
            ubahStatusDiServer(pasienDipanggil.nomor, 'Selesai')
                .then(() => {
                    if (pasienMenunggu) {
                        return ubahStatusDiServer(pasienMenunggu.nomor, 'Dipanggil');
                    } else {
                        muatDataPasien();
                    }
                })
                .then(() => muatDataPasien())
                .catch(err => console.error("Gagal memperbarui status:", err));
        } else if (pasienMenunggu) {
            // Panggil pasien pertama hari ini
            ubahStatusDiServer(pasienMenunggu.nomor, 'Dipanggil')
                .then(() => muatDataPasien())
                .catch(err => console.error("Gagal memanggil pasien:", err));
        }
    }

    function resetAntrean() {
        if (confirm("Apakah Anda yakin ingin mengosongkan dasbor antrean hari ini?")) {
            // Catatan: Karena backend masih menggunakan memori RAM sementara, mengosongkan layar depan
            // akan disinkronkan kembali saat ada pendaftaran baru atau server direstart.
            document.getElementById('patient-table-body').innerHTML = `<tr><td colspan="5" style="text-align:center; color:#95a5a6;">Tidak ada antrean tersisa hari ini</td></tr>`;
            document.getElementById('current-number').innerText = "A-000";
        }
    }

    // Eksekusi fungsi pertama kali saat halaman dibuka
    muatDataPasien();

    // Otomatis sinkronisasi data dari server setiap 3 detik sekali
    setInterval(muatDataPasien, 3000);
</script>



</body>
</html>
